ing:22px;border-radius:10px;margin:18px 0}.note{background:#e7efdf;border-left:4px solid var(--green);padding:16px 20px;margin:22px 0}.warn{background:#fff2d9;border-left-color:#b36b00}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-weight:600;margin:14px 0 6px}textarea,input,select{width:100%;padding:10px;border:1px solid #a8bbb2;border-radius:6px;background:white;color:var(--ink)}textarea{min-height:105px;resize:vertical}input[type=radio],input[type=checkbox]{width:auto;margin-right:10px}.option{display:block;font-weight:400;padding:9px 12px;background:var(--paper);border-radius:6px}fieldset{border:0;padding:0;margin:0}legend{font-weight:650;margin-bottom:12px}details{margin:16px 0;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;font-weight:650;color:var(--green)}.feedback{margin-top:12px;white-space:pre-line}.feedback.good{color:#075e52}.feedback.bad{color:#9c3c20}.bottom{display:flex;flex-wrap:wrap;gap:12px;margin:30px 0}.muted{color:#536c68;font-size:14px}progress{width:100%;accent-color:var(--green);height:12px}.steps{padding-left:24px}.steps li{padding:5px 0}table{width:100%;border-collapse:collapse;font-size:15px}td,th{border-bottom:1px solid var(--line);padding:10px;text-align:left}th{background:#e7eee7}.scroll{overflow:auto}.formula{font-size:22px;padding:15px;background:var(--paper);overflow:auto}footer{font-size:13px;margin-top:45px;border-top:1px solid var(--line);padding-top:18px}a{color:var(--green)}.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.print-only{display:none}[hidden]{display:none!important}@media(max-width:800px){.shell{grid-template-columns:1fr}aside{border-right:0;padding:15px}nav{display:flex;overflow-x:auto;position:static}nav button{flex:0 0 170px}nav small{display:none}main{padding-top:20px}.grid{grid-template-columns:1fr}header{align-items:flex-start}header small{display:none}}@media print{body{background:white;font-size:11pt}header,aside,.bottom,.tools,.no-print{display:none!important}.shell{display:block}main{padding:0;max-width:none}.print-only{display:block}textarea{border:0;min-height:0}.box{break-inside:avoid}.hero{background:white;color:black}.hero p{color:black}h1{font-size:25pt}button{display:none}}

.shell{grid-template-columns:235px minmax(0,1fr)}main{padding-top:28px}h1{font-size:clamp(27px,4vw,42px);margin:8px 0 16px}h2{font-size:21px}h3{font-size:17px}.lead{font-size:17px}.hero{padding:22px}.hero h2{font-size:24px}.box{padding:17px}.note{background:#e6f0fb}.warn{background:#fff2d9}.bottom{margin-top:18px}.material{display:inline-block;margin:4px 9px 5px 0}.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.photos figure{margin:0}.photos img{width:100%;height:178px;object-fit:contain;background:#e4edf5;border-radius:6px}.photos figcaption{font-size:13px}.video-frame iframe{width:min(100%,680px);aspect-ratio:16/9;border:0;display:block;margin-top:12px}.section-test{border-top:4px solid #2b6ea7;margin-top:24px}.section-test fieldset{margin:18px 0}.section-test legend{margin-bottom:4px}.section-test .option{margin-top:5px}.quiz-review{padding-left:22px}.quiz-review li{padding:3px 0}.help{margin-top:22px}.help summary{padding:3px 0}.time{display:inline-block;margin-left:6px;color:#355c7d}.map-button{margin-top:16px;width:100%}.test-status{color:#15568e;font-weight:650}.task{padding:12px 15px;background:#e6f0fb;border-radius:6px;margin:12px 0}.task strong{display:block}@media(max-width:800px){.shell{grid-template-columns:1fr}.map-button{width:auto}.photos img{height:145px}}.fraction{display:inline-flex;flex-direction:column;align-items:stretch;vertical-align:middle;text-align:center;line-height:1.18;margin:0 .2em;white-space:nowrap}.fraction span{padding:.15em .25em}.fraction span:first-child{border-bottom:1.5px solid currentColor}.force-figure{margin:14px 0}.force-figure svg{width:100%;max-width:720px;height:auto;display:block}.book-figures{display:flex;flex-wrap:wrap;gap:16px;margin:12px 0 20px}.book-figure{min-width:0;flex:1 1 260px;max-width:465px;margin:0;padding:12px;background:white;border:1px solid var(--line);border-radius:8px}.book-figure img{display:block;width:100%;height:auto;max-height:300px;object-fit:contain}.book-figure figcaption,.force-figure figcaption{margin-top:8px;font-size:14px}.book-figure figcaption span{display:block;font-size:12px;color:#355c7d}.force-task{padding:0 0 16px;border-bottom:1px solid var(--line)}.force-task .grid{max-width:550px}nav{position:static}.map-button{margin-block:16px}.help{padding:16px 19px;border:1px solid #e9b48c;border-radius:10px;background:#fff0e3}.help h2{margin-top:0;color:#78310e}.help details,.hint-orange{padding:10px 12px;margin:10px 0;border:1px solid #e6b48d;border-radius:7px;background:#fff8f0}.help summary,.hint-orange summary{color:#84330d}.help details[open],.hint-orange[open]{background:#ffead6}.help details p{margin-bottom:4px}.force-drawing{display:block;width:100%;height:auto;max-width:670px;border:1px solid #bacde0;border-radius:6px;margin-top:12px}.force-drawing#kraftwegCanvas{touch-action:none;cursor:crosshair;user-select:none}.book-figures .wide-figure{max-width:690px}.book-figures .wide-figure img{max-height:360px}nav button[data-locked="true"] .gate-label::after{content:" · Prüfung erforderlich"}#gateNav{border:1px solid #96b4d0}#reviewFeedback{font-weight:650}.review-bottom{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}

<header><div class="brand"><img src="material/bs-pegnitz.png" alt="Logo der Staatlichen Berufsschule Pegnitz"><div><b>Lernwerkstatt Instandhaltung</b><br>Staatliche Berufsschule Pegnitz</div></div><small>Industriemechanik · Jahrgang 11</small></header>
<div class="shell"><aside><p class="eyebrow">Dein Lernweg</p><p id="progressText"></p><progress id="progress" max="7" value="0" aria-label="Bearbeitete Lernphasen"></progress><nav id="nav" aria-label="Lernphasen"></nav><button class="map-button" id="printMap">Instandhaltungsmappe öffnen</button><p class="muted">Dein Stand wird auf diesem Gerät gespeichert. Bei geteilten Rechnern nach der Arbeit exportieren und zurücksetzen.</p></aside><main id="main" tabindex="-1"></main></div>
<script>
'use strict';
const KEY='waelzlager-kurs-v1';
let state={page:0,done:[],answers:{},passed:{}};let storageAvailable=true;
try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s&&Array.isArray(s.done)&&s.answers&&typeof s.answers==='object')state={...state,...s,page:0};}}catch{storageAvailable=false;}
const titles=['Auftrag verstehen','Fehler eingrenzen','Baugruppe untersuchen','Berechnen & auswählen','Instandsetzung planen','Werkstattauftrag','Prüfen & reflektieren'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{storageAvailable=false;}const el=document.getElementById('saveStatus');if(el)el.textContent=storageAvailable?'Lokal gespeichert. Für einen Rechnerwechsel Lernstand exportieren.':'Speicherung nicht verfügbar. Bitte Lernstand vor dem Schließen exportieren.';}
function field(id,title,placeholder='Deine Antwort …'){return `<label for="${id}">${title}</label><textarea id="${id}" data-save="${id}" placeholder="${placeholder}">${esc(state.answers[id])}</textarea>`;}
function quiz(id,question,options,correct,explanation){return `<section class="box"><fieldset><legend>${question}</legend>${options.map((o,i)=>`<label class="option"><input type="radio" name="${id}" value="${i}" ${String(state.answers[id])===String(i)?'checked':''} data-save="${id}">${o}</label>`).join('')}</fieldset><button style="margin-top:14px" data-quiz="${id}" data-correct="${correct}">Antwort prüfen</button><p id="fb-${id}" class="feedback" aria-live="polite">${state.passed[id]?'Bereits richtig beantwortet.':''}</p><template id="ex-${id}">${explanation}</template></section>`;}
const pages=[
()=>`<p class="eyebrow">01 / Informieren · ca. 35 Minuten</p><h1>Störung an der Alzmetall-Bohrmaschine</h1><p class="lead">Du bist heute im Instandhaltungsteam der Schulwerkstatt. Die Werkstattleitung meldet ein mahlendes Geräusch an der neuen Alzmetall-Säulenbohrmaschine.</p><div class="hero"><p class="eyebrow">Der Arbeitsauftrag</p><h2>Störungsmeldung aus der Werkstatt</h2><p>Das Geräusch tritt auch im Leerlauf auf und verändert sich mit der Drehzahl. Die Maschine bleibt bis zur Klärung außer Betrieb. Finde anhand von Beobachtungen und Unterlagen heraus, woher das Geräusch kommen könnte. Halte fest, welche Befunde deine Vermutung stützen und welche Fragen noch offen sind.</p></div><div class="strip"><div><strong>7 Phasen</strong>Ein vollständiger Arbeitsauftrag</div><div><strong>3–10 Minuten</strong>Kurztest pro Kapitel</div><div><strong>1 Mappe</strong>Deine Ergebnisse für die Praxis</div></div><div class="photos"><figure><a href="material/alzmetall-3.jpg" target="_blank" rel="noopener"><img src="material/alzmetall-3.jpg" alt="Alzmetall von vorn" loading="lazy"></a><figcaption>Alzmetall von vorn</figcaption></figure><figure><a href="material/alzmetall-4.jpg" target="_blank" rel="noopener"><img src="material/alzmetall-4.jpg" alt="Alzmetall von der Seite" loading="lazy"></a><figcaption>Alzmetall von der Seite</figcaption></figure><figure><a href="material/alzmetall-5.jpg" target="_blank" rel="noopener"><img src="material/alzmetall-5.jpg" alt="Alzmetall: Maschinenkopf und Antrieb" loading="lazy"></a><figcaption>Alzmetall: Maschinenkopf und Antrieb</figcaption></figure></div><h2>So arbeitest du mit dem Kurs</h2><ol class="steps"><li>Klicke dich nacheinander durch die Kapitel. Lies zuerst den Auftrag und schau dir die Materialien an.</li><li>Schreibe deine Beobachtungen, Rechnungen und Entscheidungen in die Felder. So entsteht deine Projektmappe Stück für Stück.</li><li>Wenn du feststeckst, öffne einen Tipp oder die Schritt-für-Schritt-Hilfe.</li><li>Bearbeite am Ende jedes Kapitels den Kurztest. Prüfe die Rückmeldung und markiere das Kapitel als bearbeitet.</li><li>Unter „Instandhaltungsmappe öffnen“ kannst du deine Ergebnisse ansehen, drucken oder als PDF speichern.</li></ol><p class="note"><strong>Dein erster Schritt:</strong> Beschreibe das Problem in eigenen Worten. Halte anschließend Fragen fest, die du an die Werkstattleitung stellen würdest.</p>${field('auftrag','Formuliere den Auftrag in eigenen Worten.')}${field('infos','Welche Informationen fehlen dir für die Bearbeitung?','Was möchtest du über das Geräusch und seinen Zeitpunkt erfahren?')}<h2>Deine Instandhaltungsmappe</h2><p>Notiere deine Ergebnisse in den folgenden Phasen. Unter „Lernstand“ kannst du sie drucken oder als Datei sichern. Verwende auf gemeinsam genutzten Rechnern möglichst ein Kürzel.</p><label for="alias">Kürzel / Gruppe (freiwillig)</label><input id="alias" data-save="alias" value="${esc(state.answers.alias)}">`,
()=>`<p class="eyebrow">02 / Informieren · ca. 55 Minuten</p><h1>Vom Geräusch zur begründeten Vermutung.</h1><p class="lead">Ein auffälliges Geräusch ist ein Befund. Die Ursache musst du erst eingrenzen.</p><h2>Woher könnte das Geräusch kommen?</h2><p>Sieh dir die Fotos in Kapitel 1 an. Notiere mindestens zwei mögliche Ursachen. Schreib zu jeder auf, welche Beobachtung deine Vermutung stützen oder schwächen würde.</p>${field('ersteVermutung','Deine ersten Vermutungen vor dem Befundvergleich')}<details><summary>Weitere Befunde aus der Werkstatt öffnen</summary><div class="box"><ul><li>Das Geräusch ist auch ohne eingespanntes Werkzeug hörbar.</li><li>In der Nähe des Maschinenkopfs ist es deutlicher zu hören.</li><li>Bei einer fachgerecht abgesicherten Prüfung läuft die Spindel beim Drehen von Hand rau.</li></ul><p>Welche Ursache kommt nach diesen Befunden eher infrage? Welche kannst du noch nicht ausschließen?</p></div></details><details><summary>Fachliche Einordnung nach deiner Vermutung</summary><p>Die Beobachtungen geben Anlass, die Spindellagerung näher zu untersuchen. Sie belegen noch keinen bestimmten Schaden. Auch der Antrieb kommt als Quelle infrage. Begründe, welche Prüfung die Möglichkeiten weiter eingrenzen würde.</p></details>${quiz('diagnose','Welche Aussage ist fachlich begründet?',['Das Geräusch beweist einen Wälzlagerschaden.','Die Befunde sprechen für eine Untersuchung der Lagerung; weitere Prüfungen sind nötig.','Die höchste Drehzahl ist immer die beste Diagnosemethode.'],1,'Geräusch, Laufverhalten und weitere Befunde müssen zusammen bewertet werden. Unkontrollierte Probeläufe sind keine geeignete Diagnose.') }<h2>Schadensbilder als Hinweise</h2><div class="scroll"><table><tr><th>Befund</th><th>Mögliche Zusammenhänge</th></tr><tr><td>Korrosion</td><td>Feuchtigkeit, Lagerung oder Dichtungsprobleme</td></tr><tr><td>Eindrückungen</td><td>Fremdkörper oder unsachgemäße Krafteinleitung</td></tr><tr><td>Ausbrüche an Laufbahnen</td><td>Ermüdung; weitere Betriebsbedingungen prüfen</td></tr><tr><td>Verfärbungen</td><td>Thermische Einwirkung; Ursache weiter untersuchen</td></tr></table></div>${field('diagnoseplan','Dein Diagnoseplan: Prüfung, erwarteter Befund und Bedeutung')}${field('verdacht','Deine Verdachtsdiagnose und mögliche Alternativen')}`,
()=>`<p class="eyebrow">03 / Informieren · ca. 80 Minuten</p><h1>Verstehe die Lagerung.</h1><p class="lead">Bevor du ein Lager auswählst oder ausbaust, klärst du seine Aufgabe im System.</p><h2>Aufbau und Belastung</h2><p>Ein typisches Wälzlager besteht aus Innenring, Außenring, Wälzkörpern und Käfig. Dichtungen oder Deckscheiben können hinzukommen. Radiale Kräfte wirken quer zur Wellenachse, axiale Kräfte entlang der Achse.</p><div class="scroll"><table><tr><th>Lagerart</th><th>Typische Eigenschaften</th></tr><tr><td>Rillenkugellager</td><td>Radiale und begrenzte axiale Belastung in beide Richtungen; genaue Grenzen im Katalog</td></tr><tr><td>Zylinderrollenlager</td><td>Hohe radiale Tragfähigkeit; axiale Führung abhängig von der Bauform</td></tr><tr><td>Schrägkugellager</td><td>Kombinierte Belastung; einreihig meist axiale Lastaufnahme in einer Richtung</td></tr><tr><td>Kegelrollenlager</td><td>Radiale und axiale Belastung; Anordnung und Einstellung beachten</td></tr><tr><td>Pendelrollenlager</td><td>Hohe Tragfähigkeit und Ausgleich begrenzter Winkelfehler</td></tr></table></div><div class="book-figures"><figure class="book-figure"><a href="material/ht-aufbau.png" target="_blank" rel="noopener"><img src="material/ht-aufbau.png" alt="Explosionsdarstellung mit Dichtung, Ringen, Wälzkörpern und Käfig" loading="lazy"></a><figcaption>Verfolge den Aufbau von außen nach innen. <span>Handwerk und Technik, S. 213</span></figcaption></figure><figure class="book-figure"><a href="material/ht-waelzkoerper.png" target="_blank" rel="noopener"><img src="material/ht-waelzkoerper.png" alt="Kugel, Zylinderrolle, Nadelrolle, Kegelrolle und Pendelrollen" loading="lazy"></a><figcaption>Vergleiche die Formen der Wälzkörper. <span>Handwerk und Technik, S. 213</span></figcaption></figure></div><h2>Zeichnung lesen</h2><p>Öffne die Alzmetall-Unterlagen. Gib in der Mappe an, welchen Ausschnitt du auswertest. Markiere Welle, Gehäuse, Lagerstellen, Sicherungen, Dichtungen und relevante Maße. Kläre, wie die axiale Führung und die Wärmeausdehnung berücksichtigt werden.</p><div class="box"><h3>Zeichnungen und Buchscan</h3><div class="photos"><figure><a href="material/alzmetall-1.jpg" target="_blank" rel="noopener"><img src="material/alzmetall-1.jpg" alt="Alzmetall: Schnittzeichnung" loading="lazy"></a><figcaption>Alzmetall: Schnittzeichnung</figcaption></figure><figure><a href="material/alzmetall-2.jpg" target="_blank" rel="noopener"><img src="material/alzmetall-2.jpg" alt="Alzmetall: Blatt aus der Maschinenunterlage" loading="lazy"></a><figcaption>Alzmetall: Blatt aus der Maschinenunterlage</figcaption></figure></div><p><a class="material" href="material/ht-waelzlager.pdf#page=1" target="_blank" rel="noopener">HT-Verlag · S. 213–215: Aufbau und Darstellung (PDF)</a><a class="material" href="material/ht-waelzlager.pdf#page=3" target="_blank" rel="noopener">HT-Verlag · S. 216–217: Lageranordnung und Umlaufverhältnisse (PDF)</a></p></div><h3>Festlager, Loslager und Betriebsspiel</h3><div class="book-figures"><figure class="book-figure"><a href="material/ht-fest-los.png" target="_blank" rel="noopener"><img src="material/ht-fest-los.png" alt="Schnitt mit Festlager links und verschieblichem Loslagerring rechts" loading="lazy"></a><figcaption>Suche den axial verschieblichen Lagerring. <span>Handwerk und Technik, S. 215</span></figcaption></figure></div><p>Das Festlager legt die Welle axial fest. Das Loslager ermöglicht einen axialen Längenausgleich, etwa bei Erwärmung. Bei einer angestellten Lagerung können Lager auf Spiel oder Vorspannung eingestellt sein. Die O-Anordnung hat eine größere wirksame Stützbasis als die X-Anordnung bei gleicher Einbaulage und vergleichbaren Lagern. Das Betriebsspiel ist die verbleibende Lagerluft unter Betriebsbedingungen.</p><p>Verteilt sich die Last relativ zum Lagerring über dessen Umfang, hat der Ring Umfangslast. Dafür ist in der Regel ein fester Sitz erforderlich. Bei Punktlast kann eine lose Passung zulässig sein. Maßgeblich ist die Herstellerangabe.</p><div class="book-figures"><figure class="book-figure wide-figure"><a href="material/ht-x-o.png" target="_blank" rel="noopener"><img src="material/ht-x-o.png" loading="lazy" alt="O-Anordnung links mit nach außen laufenden Drucklinien und größerer Stützbasis H; X-Anordnung rechts mit nach innen laufenden Drucklinien und kleinerer Stützbasis H"></a><figcaption>O-Anordnung und X-Anordnung. Vergleiche, in welche Richtung die Drucklinien laufen und wo sie die Wellenachse schneiden.<span>Handwerk und Technik, S. 215, Abb. 3 (Ausschnitt)</span></figcaption></figure></div><details class="hint-orange"><summary>Hilfestellung: Lagerbezeichnung 6205</summary><p>Bei vielen metrischen Standardlagern entspricht die Bohrungskennzahl ab 04 dem Fünffachen in Millimetern: 05 × 5 = 25 mm. Ausnahmen und Nachsetzzeichen müssen im Herstellerkatalog geprüft werden. Die Bezeichnung allein beschreibt nicht jede Ausführungsanforderung.</p></details>${quiz('richtung','Wie wirkt eine axiale Kraft?',['Quer zur Wellenachse.','Entlang der Wellenachse.','Immer senkrecht zur Gewichtskraft.'],1,'Axial bezieht sich auf die Wellenachse, radial auf die Richtung quer dazu.')}${field('zeichnung','Ergebnis der Zeichnungsanalyse','Lagerstellen, Sicherungen, Maße und offene Fragen …')}${field('lagerart','Welche Lagerart erkennst du? Begründe die Funktion anhand der Unterlagen.')}${drawingExercise()}`,
()=>`<p class="eyebrow">04 / Planen · ca. 145 Minuten</p><h1>Rechnen. Vergleichen. Auswählen.</h1><p class="lead">Zeichne die Kräfte ein, rechne auf Papier oder in deiner Mappe und überprüfe danach die Ergebnisse.</p><div class="note">Rechne mit den angegebenen Übungsdaten für eine vereinfachte Welle.</div><h2>1 · Lagerkräfte Schritt für Schritt</h2><p>Wir betrachten eine Welle mit zwei Lagern A und B. Eine einzelne Radialkraft F wirkt senkrecht zur Welle zwischen den Lagern. Für dieses Modell vernachlässigen wir das Eigengewicht und weitere Lasten.</p><figure class="force-figure"><svg viewBox="0 0 640 238" role="img" aria-label="Freikörperbild: Lager A links, Lager B rechts. Die Last F wirkt 80 Millimeter rechts von A nach unten. Lagerabstand 200 Millimeter. Die Lagerreaktionen F A und F B zeigen nach oben." xmlns="http://www.w3.org/2000/svg"><defs><marker id="kraft-pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect x="4" y="4" width="632" height="230" rx="12" fill="#edf5fc"/><path d="M100 104H540" stroke="#153a5a" stroke-width="11" stroke-linecap="round"/><g fill="#c5d9ee" stroke="#153a5a" stroke-width="2"><path d="M100 109l-17 25h34z"/><path d="M540 109l-17 25h34z"/></g><g stroke-width="4" marker-end="url(#kraft-pfeil)"><path d="M100 91V40M540 91V40" stroke="#15649a"/><path d="M276 40V94" stroke="#a53428"/></g><g font-family="system-ui" font-size="19" font-weight="650" fill="#153a5a"><text x="72" y="32">F<tspan baseline-shift="sub" font-size="12">A</tspan></text><text x="529" y="32">F<tspan baseline-shift="sub" font-size="12">B</tspan></text><text x="289" y="56" fill="#a53428">F = 1.200 N</text><text x="93" y="156">A</text><text x="533" y="156">B</text></g><g stroke="#526f84" fill="none" stroke-width="1.5"><path d="M100 161v55M276 110v76M540 161v55"/><path d="M101 178H275M277 178H539M101 208H539" marker-start="url(#kraft-pfeil)" marker-end="url(#kraft-pfeil)"/></g><g font-family="system-ui" font-size="15" fill="#153a5a" text-anchor="middle"><text x="188" y="173">a = 80 mm</text><text x="408" y="173">b = 120 mm</text><text x="320" y="230">ℓ = 200 mm</text></g></svg><figcaption>Freikörperbild der Welle. Die Kraft F wirkt nach unten. A und B stützen die Welle nach oben ab.</figcaption></figure><div class="box"><ol class="steps"><li><strong>Abstände ablesen.</strong> Von A bis zur Kraft sind es a = 80 mm. Von der Kraft bis B sind es b = 120 mm. Der Lagerabstand ℓ beträgt 200 mm.</li><li><strong>Momente um A bilden.</strong> Denk dir A als Drehpunkt. F dreht im Uhrzeigersinn, F<sub>B</sub> entgegengesetzt. F<sub>A</sub> greift in A an und hat dort keinen Hebelarm. Im Gleichgewicht sind die beiden Momente gleich groß.<div class="formula">F<sub>B</sub> · ℓ = F · a</div></li><li><strong>Nach F<sub>B</sub> auflösen.</strong> Teile beide Seiten durch ℓ. In der Rechnung kürzen sich die Millimeter.<div class="formula">F<sub>B</sub> = <span class="fraction"><span>F · a</span><span>ℓ</span></span> = <span class="fraction"><span>1.200 N · 80 mm</span><span>200 mm</span></span> = 480 N</div></li><li><strong>F<sub>A</sub> mit dem Kräftegleichgewicht bestimmen.</strong> Beide Lagerkräfte zusammen tragen die Last.<div class="formula">F<sub>A</sub> = F − F<sub>B</sub> = 1.200 N − 480 N = 720 N</div></li><li><strong>Ergebnis prüfen.</strong> 720 N + 480 N = 1.200 N. Die Last liegt näher an A, daher ist F<sub>A</sub> größer. Zur Gegenprobe kannst du das Moment um B bilden: F<sub>A</sub> · ℓ = F · b.</li></ol></div><h2>2 · Nominelle Lebensdauer</h2><p class="formula">L<sub>10h</sub> = <span class="fraction"><span>10<sup>6</sup></span><span>60 · n</span></span> · (<span class="fraction"><span>C</span><span>P</span></span>)<sup>p</sup></p><p>C ist die dynamische Tragzahl [kN], P die äquivalente dynamische Lagerbelastung [kN] und n die Drehzahl [min⁻¹]. Für Kugellager gilt p = 3, für Rollenlager p = <span class="fraction"><span>10</span><span>3</span></span>. Die nominelle Lebensdauer gilt für 90 % Zuverlässigkeit unter den Modellannahmen.</p><details class="hint-orange"><summary>Rechenbeispiel für ein Kugellager</summary><p>C = 10 kN, P = 2 kN und n = 1.000 min⁻¹. Der Quotient aus C und P ist 5.</p><div class="formula">L<sub>10h</sub> = <span class="fraction"><span>10<sup>6</sup></span><span>60 · 1.000</span></span> · 5<sup>3</sup> ≈ 2.083 h</div></details><details><summary>Wann ist P gleich der Radialkraft?</summary><p>Prüfe die Angaben für die jeweilige Lagerart im Herstellerkatalog. Bei kombinierter Radial- und Axialbelastung können weitere Faktoren erforderlich sein.</p></details><h2>3 · Auswahl begründen</h2><p>Vergleiche Baugröße, Belastungsrichtung, Tragzahl, erforderliche Lebensdauer, Drehzahlgrenzen, Passung, Lagerluft, Dichtung und Schmierung. Ein passender Bohrungsdurchmesser genügt nicht als Auswahlkriterium.</p><div class="box"><h3>Auswahlaufgabe · vereinfachter Katalogauszug</h3><p>Gefordert: Rillenkugellager mit d × D × B = 25 × 52 × 15 mm, mindestens 4.000 h bei P = 2 kN und n = 1.000 min⁻¹. Beide Luft- und Dichtungsausführungen seien gleich. Die Werte sind Übungsdaten.</p><div class="scroll"><table><tr><th>Kandidat</th><th>Abmessungen [mm]</th><th>C [kN]</th></tr><tr><td>A</td><td>25 × 52 × 15</td><td>12</td></tr><tr><td>B</td><td>25 × 52 × 15</td><td>14</td></tr><tr><td>C</td><td>25 × 62 × 17</td><td>18</td></tr></table></div><p>Weise nach, welcher Kandidat beide Anforderungen erfüllt. Berechne die Lebensdauer von A und B mit der Formel und dokumentiere deine Auswahl.</p></div>${field('rechnung','Dokumentiere deinen Rechenweg mit Einheiten und Annahmen.')}${field('auswahl','Deine Lagerauswahl mit Katalogquelle, Daten und Begründung')}`,
()=>`<p class="eyebrow">05 / Planen & Entscheiden · ca. 80 Minuten</p><h1>Erst der Plan. Dann das Werkzeug.</h1><p class="lead">Du leitest aus Zeichnung, Passungen und Herstellerunterlagen einen passenden Arbeitsablauf ab.</p><h2>Dein Arbeitsplan braucht</h2><ul><li>Identifikation des konkreten Übungsaufbaus und der Lager.</li><li>Demontagefolge mit Sicherungselementen und geeigneten Werkzeugen.</li><li>Kontrolle von Welle, Gehäuse, Lager und Anschlussflächen.</li><li>Montageverfahren, Krafteinleitung und erforderliche Prüfungen.</li><li>Schmierung und Einstellung entsprechend den Unterlagen.</li></ul><div class="note"><strong>Dein Werkstattauftrag:</strong> Die Demontage und Montage übst du in vereinfachter Form am SKF-Demonstrationssatz ESW 8001. Plane für den Aufbau, den dir die Lehrkraft zuweist.<br><a class="material" href="material/demoset-1.pdf" target="_blank" rel="noopener">Demoset I · Zeichnung</a><a class="material" href="material/demoset-2.pdf" target="_blank" rel="noopener">Demoset II · Zeichnung</a><a class="material" href="material/esw-8001.pdf" target="_blank" rel="noopener">SKF-Anleitung</a></div><h2>Schmierung und Montageverfahren</h2><div class="book-figures"><figure class="book-figure"><a href="material/ht-fettschmierung.png" target="_blank" rel="noopener"><img src="material/ht-fettschmierung.png" alt="Zwei Beispiele für Fettzufuhr am Lager, rechts über einen Schmiernippel" loading="lazy"></a><figcaption>Verfolge den Weg des Fetts bis zum Lager. <span>Handwerk und Technik, S. 217</span></figcaption></figure><figure class="book-figure"><a href="material/ht-einbau.png" target="_blank" rel="noopener"><img src="material/ht-einbau.png" alt="Querschnitt mit Pfeil für die Einpresskraft am fest sitzenden Lagerring" loading="lazy"></a><figcaption>Verfolge die Montagekraft bis zum Ring mit festem Sitz. <span>Handwerk und Technik, S. 218</span></figcaption></figure></div><p>Der Schmierfilm trennt belastete Kontaktflächen. Schmierstoff schützt außerdem vor Korrosion. Öl kann Wärme abführen, Fett kann zusätzlich abdichtend wirken. Bei Ölbadschmierung ist der Ölstand nach Vorgabe zu prüfen. Bei Tropfölschmierung richtet sich die Zufuhr unter anderem nach Drehzahl und Belastung.</p><p>Mechanische, thermische und hydraulische Verfahren richten sich nach Sitz, Lagerbauart und Ausrüstung. Vor dem Fügen prüfst du Sitzflächen, Sauberkeit und die Lagerbezeichnung.</p><a class="material" href="material/ht-waelzlager.pdf#page=3" target="_blank" rel="noopener">HT-Verlag · S. 217–218: Schmierung (PDF)</a><a class="material" href="material/ht-waelzlager.pdf#page=4" target="_blank" rel="noopener">HT-Verlag · S. 218–221: Montage und Demontage (PDF)</a><section class="box"><h3>SKF-Video: Rillenkugellager</h3><p>Beobachte, an welchem Ring das Werkzeug angreift und wie die Kraft eingeleitet wird. Vergleiche das mit deinem SKF-Aufbau: Im Demoset sind auch Pendelrollenlager und Hülsen eingezeichnet.</p><button id="loadVideo">Video hier laden</button><div id="videoFrame" class="video-frame"></div><p><a href="https://www.youtube.com/watch?v=n9zWjmodm8k" target="_blank" rel="noopener">SKF-Video separat öffnen</a> · <a href="https://www.skf.com/de/products/maintenance-products/mounting-and-dismounting-of-skf-bearings" target="_blank" rel="noopener">SKF-Übersicht</a></p></section><div class="note warn">Keine pauschalen Temperatur-, Drehmoment- oder Schmiermengenvorgaben: Diese hängen von Lagerausführung, Verfahren und Aufbau ab. Verwendet die konkrete Anleitung und die Vorgaben der Lehrkraft.</div>${quiz('kraftfluss','Ein Lager soll mit festem Sitz auf die Welle montiert werden. Wo wird die Montagekraft beim mechanischen Aufschieben eingeleitet?',['Am Außenring, damit alle Teile gleichzeitig bewegt werden.','Am Innenring, der auf die Welle gefügt wird.','Am Käfig.'],1,'Die Montagekraft wird am Ring mit dem festen Sitz eingeleitet. Sie darf dabei nicht über die Wälzkörper übertragen werden. Wenn beide Ringe gleichzeitig gefügt werden, ist eine geeignete Unterstützung beider Ringe erforderlich.')}${field('werkzeuge','Werkzeug- und Hilfsmittelliste mit Begründung')}${field('arbeitsplan','Arbeitsfolge: Schritt → Werkzeug → Prüfpunkt','1. …\n2. …\n3. …')}${field('sicherheit','Gefährdungen, Schutzmaßnahmen und Abbruchkriterien')}${field('freigabeFragen','Offene Fragen für das Freigabegespräch')}<h2>Vorbereitung auf die Werkstatt</h2><p>Besprich deine Diagnose, Auswahl und Arbeitsfolge mit der Lehrkraft. Online-Ergebnisse und Häkchen erteilen keine praktische Arbeitsfreigabe.</p>`,
()=>`<p class="eyebrow">06 / Ausführen · ca. 145 Minuten</p><h1>Deine Planung wird Praxis.</h1><p class="lead">Arbeite am ESW 8001 ausschließlich nach Unterweisung und ausdrücklicher Freigabe durch die Lehrkraft.</p><div class="note warn"><strong>Vor dem Start:</strong> Der konkrete Aufbau, die Herstelleranleitung und die örtliche Unterweisung bestimmen das Vorgehen. Diese Seite ist ein Arbeitsprotokoll und keine vollständige Montageanleitung.</div><div class="box"><h3>Dein SKF-Aufbau</h3><div class="photos"><figure><a href="material/esw-1.jpg" target="_blank" rel="noopener"><img src="material/esw-1.jpg" alt="ESW 8001: Aufbau mit Stehlagergehäusen" loading="lazy"></a><figcaption>ESW 8001: Aufbau mit Stehlagergehäusen</figcaption></figure><figure><a href="material/esw-2.jpg" target="_blank" rel="noopener"><img src="material/esw-2.jpg" alt="ESW 8001: Detailansicht des Aufbaus" loading="lazy"></a><figcaption>ESW 8001: Detailansicht des Aufbaus</figcaption></figure><figure><a href="material/esw-3.jpg" target="_blank" rel="noopener"><img src="material/esw-3.jpg" alt="ESW 8001: Welle und Lagergehäuse" loading="lazy"></a><figcaption>ESW 8001: Welle und Lagergehäuse</figcaption></figure></div><a class="material" href="material/esw-8001.pdf" target="_blank" rel="noopener">SKF ESW 8001 · Anleitung</a><a class="material" href="material/demoset-1.pdf" target="_blank" rel="noopener">SKF Demoset I · Zeichnung</a><a class="material" href="material/demoset-2.pdf" target="_blank" rel="noopener">SKF Demoset II · Zeichnung</a><p>Demoset I zeigt Pendelrollenlager 22216 CCK auf Abziehhülse AH 316 bzw. Spannhülse H 316. Demoset II zeigt unter anderem 22216 CCK und 22216 CC. Zeige an eurem Aufbau, welches Lager und welcher Einbausitz bearbeitet werden.</p></div><h2>Team und Rollen</h2><p>Eine Person führt aus, eine zweite prüft den Arbeitsplan, eine dritte dokumentiert. Wechselt die Rollen so, dass jede Person praktisch arbeitet.</p>${field('rollen','Wer übernimmt welche Rolle? Wann wechselt ihr?')}<h2>Arbeit dokumentieren</h2><div class="book-figures"><figure class="book-figure"><a href="material/ht-abzieher.png" target="_blank" rel="noopener"><img src="material/ht-abzieher.png" alt="Fachkraft mit mechanischem Abzieher an einem Wälzlager" loading="lazy"></a><figcaption>Beobachte, wo der Abzieher ansetzt. Das passende Werkzeug legt ihr für euren Aufbau fest. <span>Handwerk und Technik, S. 221</span></figcaption></figure></div><ol class="steps"><li>Arbeitsplatz und Aufbau nach Unterweisung vorbereiten.</li><li>Demontage anhand des geprüften Plans durchführen.</li><li>Bauteile zuordnen und Befunde dokumentieren.</li><li>Bei Abweichungen unterbrechen und die Lehrkraft hinzuziehen.</li><li>Montage anhand des geprüften Plans durchführen.</li><li>Prüfung nach Vorgabe vorbereiten.</li></ol>${field('demontage','Demontage: tatsächliche Schritte, Werkzeuge und Beobachtungen')}${field('befunde','Bauteilbefunde: Zustand und mögliche Bedeutung')}${field('montage','Montage: tatsächliche Schritte und Kontrollen')}${field('abweichungen','Abweichungen vom Plan und Rücksprache mit der Lehrkraft')}`,
()=>`<p class="eyebrow">07 / Kontrollieren & Bewerten · ca. 55 Minuten</p><h1>Wann ist der Auftrag erfüllt?</h1><p class="lead">Ein eingebautes Lager ist noch kein geprüfter Arbeitsauftrag. Halte fest, was du kontrolliert hast und mit welchem Ergebnis.</p><h2>Prüfprotokoll</h2><p>Die Lehrkraft legt die passenden Kriterien, Verfahren und zulässigen Werte für euren Aufbau fest. Dokumentiere Soll, Ist, Prüfmittel und Entscheidung. Ein Laufversuch erfolgt nur nach Freigabe und gemäß Unterweisung.</p>${field('pruefung','Prüfpunkte und Ergebnisse','Prüfpunkt | Soll / Quelle | Ist | Prüfmittel | Bewertung\n…')}${field('nacharbeit','Welche Abweichungen oder Nacharbeiten sind offen?')}<section class="box"><h2>Reflexion in Kleingruppen · 15 Minuten</h2><ol class="steps"><li><strong>3 Minuten:</strong> Notiert einzeln einen gelungenen Schritt und eine Stelle, an der ihr unsicher wart.</li><li><strong>8 Minuten:</strong> Tauscht euch zu dritt oder zu viert aus. Vergleicht, wie ihr die Störung eingegrenzt habt und wo euch Zeichnung, Rechnung oder Arbeitsplan in der Werkstatt geholfen haben. Belegt eure Aussagen mit einem Beispiel.</li><li><strong>4 Minuten:</strong> Haltet einen gemeinsamen Lerngewinn und eine konkrete Verbesserung fest. Wenn ihr euch in einem Punkt uneinig seid, notiert beide Sichtweisen.</li></ol>${field('reflexionGruppe','Gruppenkürzel und Stichpunkte aus dem Austausch')}${field('reflexion','Gemeinsames Fazit: Das behalten wir bei. Das ändern wir beim nächsten Auftrag.')}${field('reflexionTransfer','Dein persönlicher Beitrag und eine Erkenntnis aus der Gruppe')}</section>${field('uebergabe','Übergabe an den Auftraggeber','Ergebnis, durchgeführte Arbeiten, Prüfbefunde und offene Punkte …')}<div class="note">Die Markierung „bearbeitet“ dokumentiert deine Selbsteinschätzung. Fachliche Bewertung und Werkstattfreigabe liegen bei der Lehrkraft.</div><h2>Fachliche Quellen und Unterrichtsmaterial</h2><ul><li>Verlag Handwerk und Technik: Kapitel „Wälzlager“, S. 213–222.</li><li><a href="https://cdn.skfmediahub.skf.com/api/public/0901d196802809de/pdf_preview_medium/0901d196802809de_pdf_preview_medium.pdf" target="_blank" rel="noopener">SKF: Bearing size – nominelle Lebensdauer</a></li><li>Projektmaterial: Alzmetall-Fotos und Maschinenunterlagen, SKF ESW 8001 und Demoset-Zeichnungen.</li></ul><p><a class="material" href="material/ht-waelzlager.pdf#page=6" target="_blank" rel="noopener">HT-Verlag · S. 222: Übungen und Entsorgung (PDF)</a></p>`];

const support = [

const answerKey = (page, question) => (page===0?'auftrag-v2':'kapitel-' + page) + '-frage-' + question;
function validTests(raw) {
  const result = {};
  for (let page = 0; page < chapterTests.length; page++) {
    const entry = raw?.[page];
    if(page===3){
      if(Array.isArray(entry?.forces)&&entry.forces.length===4&&entry.forces.every(v=>Number.isFinite(v)&&v>=0)) result[page]={forces:entry.forces};
      continue;
    }
    if (page===0&&entry?.revision!==2) continue;
    if (!Array.isArray(entry?.choices) || entry.choices.length !== chapterTests[page].length) continue;
    if (!entry.choices.every((choice, i) => Number.isInteger(choice) && choice >= 0 && choice < chapterTests[page][i][1].length)) continue;
    result[page] = {choices:entry.choices,revision:entry.revision};
  }
  return result;
}
function scoreTest(page, entry) {
  if(page===3) return forceProblems.filter((task,i)=>[0,1].every(j=>Math.abs(entry.forces[i*2+j]-task.solution[j])<=1)).length;
  return entry.choices.filter((choice, i) => choice === chapterTests[page][i][2]).length;
}
function testSummary(page) {
  const entry = state.tests?.[page];
  if (!entry) return 'Noch nicht ausgewertet.';
  if(page===3) return forceReview(entry);
  const questions = chapterTests[page];
  return '<strong>' + scoreTest(page, entry) + ' von ' + questions.length + ' Punkten</strong><ol class="quiz-review">' +
    questions.map(([question, options, correct, explanation], i) => {
      const choice = entry.choices[i];
      return '<li><b>' + (choice === correct ? 'Richtig' : 'Zu wiederholen') + '</b> · ' +
        esc(question) + '<br>Deine Antwort: ' + esc(options[choice]) + '<br>' + esc(explanation) + '</li>';
    }).join('') + '</ol>';
}

function drawingExercise(){

function canvasPoint(event,svg){
  const matrix=svg.getScreenCTM();
  if(!matrix)return null;
  const point=svg.createSVGPoint();
  point.x=event.clientX;point.y=event.clientY;
  const local=point.matrixTransform(matrix.inverse());
  return [Math.round(Math.min(620,Math.max(0,local.x))),Math.round(Math.min(290,Math.max(0,local.y)))];
}
function finishStroke(){
  if(!activeStroke)return;
  const points=activeStroke.points;
  activeStroke=null;
  if(points.length>1)setDrawing([...drawingStrokes().slice(-79),points]);
}
function setDrawing(strokes){
  state.answers[drawingKey]=JSON.stringify(strokes);
  const layer=document.getElementById('kraftwegLines');
  if(layer)layer.innerHTML=strokeElements(strokes);
  if(releaseActive())state.release=null;
  save();updateReviewBadge();
}
document.addEventListener('pointerdown',event=>{
  const svg=event.target.closest?.('#kraftwegCanvas');
  if(!svg||event.button!==0||activeStroke)return;
  const point=canvasPoint(event,svg);
  if(!point)return;
  svg.setPointerCapture(event.pointerId);
  activeStroke={id:event.pointerId,points:[point]};
});
document.addEventListener('pointermove',event=>{
  if(activeStroke?.id!==event.pointerId||activeStroke.points.length>=500)return;
  const svg=document.getElementById('kraftwegCanvas'),point=svg&&canvasPoint(event,svg);
  if(!point)return;
  const points=activeStroke.points, last=points[points.length-1];
  if(Math.abs(point[0]-last[0])+Math.abs(point[1]-last[1])<2)return;
  points.push(point);
  document.getElementById('kraftwegLines').innerHTML=strokeElements([...drawingStrokes(),points]);
});
for(const eventName of ['pointerup','pointercancel','lostpointercapture']){
  document.addEventListener(eventName,event=>{if(activeStroke?.id===event.pointerId)finishStroke();});
}
function drawingForMap(){
  return drawingStrokes().length?'<section><h2>Skizze zum Kraftfluss</h2>'+forceDrawing()+'</section>':'';
}
function updateReviewBadge(){

}
